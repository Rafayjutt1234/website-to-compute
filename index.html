<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Madara Uchiha Attack Effect</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(#0d0d0d, #000000);
      overflow: hidden;
    }

    #madara-img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 400px;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease-in-out;
      z-index: 2;
    }

    #chakra-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255,0,0,0.4) 0%, transparent 80%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: all 0.2s ease-in-out;
      filter: blur(25px);
      opacity: 0.3;
    }

    .attack-flash {
      box-shadow: 0 0 80px 40px rgba(255, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <img id="madara-img" src="madara-uchiha-fan-model-3d-model-d9b2608c0e.jpg" alt="Madara Uchiha">
  <script src="script.js"></script>
</body>
</html>
